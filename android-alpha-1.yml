name: Build Android Alpha

on:
  workflow_dispatch:
  push:
    paths:
      - 'O_Mundo_CLT_Godot_v0.29.9.zip'
      - '.github/workflows/android-alpha.yml'

permissions:
  contents: read

jobs:
  android-alpha:
    name: Android Alpha APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"

          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable               "$HOME/.local/share/godot/export_templates/"
          fi

          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi

          godot --version
          java -version

      - name: Unpack O Mundo CLT source
        shell: bash
        run: |
          set -euo pipefail
          test -f O_Mundo_CLT_Godot_v0.29.9.zip
          rm -rf _source
          mkdir -p _source
          unzip -q O_Mundo_CLT_Godot_v0.29.9.zip -d _source

          PROJECT_DIR="$(find _source -type f -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Import and validate with Godot
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --editor --path . --quit

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build/android

          godot --headless --path .             --export-debug "Android Alpha"             "build/android/O_Mundo_CLT_Alpha_v0.29.9.apk"

          test -s build/android/O_Mundo_CLT_Alpha_v0.29.9.apk
          ls -lh build/android/O_Mundo_CLT_Alpha_v0.29.9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-Mundo-CLT-v0.29.9-Android-Alpha
          path: ${{ env.PROJECT_DIR }}/build/android/O_Mundo_CLT_Alpha_v0.29.9.apk
          if-no-files-found: error
          retention-days: 14
