name: Build Android Alpha v0.29.20

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'O_Mundo_CLT_Godot_v0.29.20.zip'
      - '.github/workflows/android-alpha.yml'

permissions:
  contents: write

concurrency:
  group: android-alpha-v0.29.20-main
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  SOURCE_ZIP: O_Mundo_CLT_Godot_v0.29.20.zip
  APK_NAME: O_Mundo_CLT_Alpha_v0.29.20.apk
  APK_PATH: build/android/O_Mundo_CLT_Alpha_v0.29.20.apk

jobs:
  android-alpha:
    name: Validar, gerar APK e atualizar main
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.7.2
      options: --user root

    steps:
      - name: Baixar a branch main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Godot e Git
        shell: bash
        run: |
          set -euo pipefail

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 zip libfontconfig1
          rm -rf /var/lib/apt/lists/*

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"

          TEMPLATE_DIR="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_DIR" ]; then
            cp -a "$TEMPLATE_DIR" "$HOME/.local/share/godot/export_templates/"
          fi

          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi

          godot --version
          java -version

      - name: Conferir ZIP da v0.29.20
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP"
          ls -lh "$SOURCE_ZIP"

      - name: Extrair o projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _source
          mkdir -p _source
          unzip -q "$SOURCE_ZIP" -d _source

          PROJECT_DIR="$(find _source -type f -name project.godot -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERRO: project.godot não encontrado dentro do ZIP.'
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Aplicar compatibilidade Godot 4.7 e sincronizar o pacote
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/main.gd")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "var screen_size:=mobile_ui_manager.canvas_size()": "var screen_size:Vector2=mobile_ui_manager.canvas_size()",
              "var code:=input.text.strip_edges().to_upper()": "var code:String=input.text.strip_edges().to_upper()",
              'var session_state:="N/D" if alpha_session_manager==null else alpha_session_manager.session_summary()': 'var session_state:String="N/D" if alpha_session_manager==null else str(alpha_session_manager.session_summary())',
              "var launches:=0 if alpha_session_manager==null else alpha_session_manager.launch_count": "var launches:int=0 if alpha_session_manager==null else int(alpha_session_manager.launch_count)",
              "var scale := mobile_ui_manager.get_touch_scale()": "var scale:float=float(mobile_ui_manager.get_touch_scale())",
              "var base_size := Vector2(168,168) * scale": "var base_size:Vector2=Vector2(168,168) * scale",
              "var local_center := base_size * 0.5": "var local_center:Vector2=base_size * 0.5",
              "var knob_size := Vector2(64,64) * scale": "var knob_size:Vector2=Vector2(64,64) * scale",
              'var hud_day := "SEGUNDA-FEIRA" if tutorial_manager.is_active() else workday_manager.get_day_label()': 'var hud_day:String="SEGUNDA-FEIRA" if tutorial_manager.is_active() else str(workday_manager.get_day_label())',
              "var week_to_show:=workday_manager.current_week": "var week_to_show:int=int(workday_manager.current_week)",
              "var transition:=life_cycle_manager.sleep_and_advance(workday_manager.get_day_label(),workday_manager.current_week)": "var transition:String=str(life_cycle_manager.sleep_and_advance(workday_manager.get_day_label(),workday_manager.current_week))",
              "var day_name:=workday_manager.get_day_label()": "var day_name:String=str(workday_manager.get_day_label())",
              "var mentor:=tutorial_manager.get_mentor_name(area)": "var mentor:String=str(tutorial_manager.get_mentor_name(area))",
          }

          changed = 0
          for before, after in replacements.items():
              if before in text:
                  changed += text.count(before)
                  text = text.replace(before, after)
              elif after not in text:
                  raise SystemExit(f"Trecho esperado não encontrado em main.gd: {before}")

          path.write_text(text, encoding="utf-8")
          print(f"Compatibilidade Godot 4.7 aplicada em {changed} ocorrência(s).")
          PY

          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/.github/workflows/android-alpha.yml" .github/workflows/android-alpha.yml
          python3 tools/make_build_manifest.py

      - name: Validar arquivos, cenas e scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x tools/validate_with_godot.sh tools/build_android_alpha.sh
          python3 tools/preflight_check.py
          GODOT_BIN=godot tools/validate_with_godot.sh

      - name: Testar fluxo de abertura
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          SMOKE_LOG="$(mktemp)"
          trap 'rm -f "$SMOKE_LOG"' EXIT

          set +e
          godot --headless --path . --script res://tools/startup_smoke_test.gd 2>&1 | tee "$SMOKE_LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

          if grep -Eqi 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Cannot load script' "$SMOKE_LOG"; then
            echo 'ERRO: o smoke test encontrou falha no fluxo de abertura.'
            exit 1
          fi

      - name: Gerar O_Mundo_CLT_Alpha_v0.29.20.apk
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          GODOT_BIN=godot tools/build_android_alpha.sh
          test -s "build/android/$APK_NAME"

          mkdir -p "$GITHUB_WORKSPACE/build/android"
          cp "build/android/$APK_NAME" "$GITHUB_WORKSPACE/$APK_PATH"
          ls -lh "$GITHUB_WORKSPACE/$APK_PATH"

      - name: Atualizar o ZIP final sincronizado
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -f "$GITHUB_WORKSPACE/${SOURCE_ZIP}.new"
          zip -qr "$GITHUB_WORKSPACE/${SOURCE_ZIP}.new" . -x '.godot/*' 'build/*' '__pycache__/*'
          mv "$GITHUB_WORKSPACE/${SOURCE_ZIP}.new" "$GITHUB_WORKSPACE/$SOURCE_ZIP"
          unzip -t "$GITHUB_WORKSPACE/$SOURCE_ZIP"
          ls -lh "$GITHUB_WORKSPACE/$SOURCE_ZIP"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: O-Mundo-CLT-v0.29.20-Android-Alpha
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Fazer commit e push do APK na main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$APK_PATH" "$SOURCE_ZIP"

          if git diff --cached --quiet; then
            echo 'O APK e o pacote-fonte v0.29.20 já estão atualizados na main.'
            exit 0
          fi

          git commit -m 'build(android): publicar Alpha v0.29.20 e pacote sincronizado [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
